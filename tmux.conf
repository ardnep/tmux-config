set -g default-terminal "xterm-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
# Prefix: Alt/Option + Space (thumb + thumb). Requires Alacritty's
# option_as_alt setting, otherwise macOS composes a non-breaking space.
set -g prefix M-Space
set -g prefix2 C-b        # TEMPORARY: old prefix kept alive during transition — delete this line once M-Space is muscle memory
unbind C-b
bind M-Space send-prefix

set -g status-position top
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @catppuccin_flavor 'mocha' # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'         # short window name, not full pane title
set -g @catppuccin_window_current_text ' #W'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

bind -n M-, previous-window
bind -n M-. next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh
