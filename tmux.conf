# ── Terminal ──────────────────────────────────────────────────────────────────
# tmux-256color is the terminfo that actually describes tmux (italics, correct
# key handling). terminal-features matches the OUTER client's TERM.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# OSC 52 clipboard. The stock xterm-256color Ms uses %p1 for the selection,
# which tmux sends empty; hardcoding "c" is what actually reaches the clipboard.
# tmux-256color has no Ms at all, so inner apps need it spelled out too.
# Plain `set -s` (not -as) so re-sourcing cannot stack duplicates.
set -s terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p2%s\\007,tmux-256color:Ms=\\E]52;c;%p2%s\\007"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ── Prefix ────────────────────────────────────────────────────────────────────
# Alt/Option + Space (thumb + thumb). Requires Alacritty's option_as_alt
# setting, otherwise macOS composes a non-breaking space.
set -g prefix M-Space
unbind C-b
bind M-Space send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g status-position top
set -g default-shell /bin/zsh

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Killing a session drops you into another one rather than back to the shell.
set -g detach-on-destroy off

# A pane that rings the bell flags its window in the status bar — this is how a
# background agent announces it is done.
set -g monitor-bell on
set -g visual-bell off

set -g set-titles on
set -g set-titles-string "#S:#W"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# resurrect only saves on demand; continuum snapshots on a timer and restores
# on server start.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

set -g @catppuccin_flavor 'mocha' # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'         # short window name, not full pane title
set -g @catppuccin_window_current_text ' #W'

# ── Panes ─────────────────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits and new windows open where the current pane already is.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ── Windows and sessions ──────────────────────────────────────────────────────
bind -n M-, previous-window
bind -n M-. next-window

# `l` is taken by select-pane above, so last-window moves here.
bind Tab last-window
bind -n M-Tab last-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind C-j choose-tree -Zs

# ── Copy mode ─────────────────────────────────────────────────────────────────
# mode-keys vi is already on via tmux-sensible. M-u enters copy mode without the
# prefix; then hjkl to move, C-u/C-d by half a page, / and ? to search, v/y to
# select and copy, q to leave.
bind -n M-u copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

# ── Config ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Catppuccin v2 styles the window list but leaves status-left/right alone, so
# the modules have to be composed here — after the plugin has loaded.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g  status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
